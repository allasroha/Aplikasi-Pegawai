name: AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }} > pr.diff

      - name: Review PR with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PROMPT=$(cat pr.diff)
      
          jq -n \
            --arg prompt "$PROMPT" \
            '{
              contents: [{
                parts: [{
                  text: ("Review this pull request diff as a senior backend engineer.\n\n" + $prompt)
                }]
              }]
            }' > request.json
      
          curl -s \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json \
            > response.json
      
          cat response.json

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const data = JSON.parse(fs.readFileSync('response.json'))

            const review =
              data.candidates?.[0]?.content?.parts?.[0]?.text ||
              "No review generated."

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Gemini AI Review\n\n${review}`
            })
